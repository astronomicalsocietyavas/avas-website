<!DOCTYPE html>
<html>

<!DOCTYPE html>
<html>

<head>
  <title>Observation Album</title>

  <style>

    body{
      background:#050816;
      color:white;
      font-family:Arial;
      padding:30px;
    }

    h1{
      text-align:center;
      margin-bottom:30px;
    }

    .gallery{
      display:grid;
      grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
      gap:15px;
    }

    .gallery img{
      width:100%;
      height:250px;
      object-fit:cover;
      border-radius:15px;
      cursor:pointer;
      transition:0.3s;
    }

    .gallery img:hover{
      transform:scale(1.03);
    }

    #popup{
      position:fixed;
      inset:0;
      background:rgba(0,0,0,0.9);
      display:none;
      justify-content:center;
      align-items:center;
      z-index:9999;
    }

    #popup img{
      max-width:90%;
      max-height:90%;
      border-radius:15px;
    }

    #popup span{
      position:absolute;
      top:20px;
      right:35px;
      font-size:45px;
      cursor:pointer;
    }

  </style>
</head>

<body>

  <h1>Observation Night Album</h1>

  <div class="gallery">

    <img src="C:\Users\nethm\Desktop\AVAS Website\images\observation.html\photo1.jpg"
         onclick="openImage(this.src)">

    <img src="C:\Users\nethm\Desktop\AVAS Website\images\observation.html\photo2.jpg"
         onclick="openImage(this.src)">

    <img src="C:\Users\nethm\Desktop\AVAS Website\images\observation.html\photo3.jpg"
         onclick="openImage(this.src)">

    <img src="C:\Users\nethm\Desktop\AVAS Website\images\observation.html\photo4.jpg"
         onclick="openImage(this.src)">

  </div>

  <div id="popup">

    <span onclick="closeImage()">×</span>

    <img id="popup-img">

  </div>

  <script>

    function openImage(src){
      document.getElementById("popup").style.display="flex";
      document.getElementById("popup-img").src=src;
    }

    function closeImage(){
      document.getElementById("popup").style.display="none";
    }

  </script>

</body>
</html>
